name: Prepara logo e icone

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/icone.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  icons:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa Pillow
        run: python -m pip install Pillow==11.3.0

      - name: Genera PNG e aggiorna pagina
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re, base64, io, json

          js_path = Path('aggiornamenti.js')
          js = js_path.read_text()
          match = re.search(r"data:image/jpeg;base64,([^']+)", js)

          if match:
              image = Image.open(io.BytesIO(base64.b64decode(match.group(1)))).convert('RGB')
              for size in (32, 180, 192, 512):
                  image.resize((size, size), Image.Resampling.LANCZOS).save(f'moneta-{size}.png')

              js = js.split('const source=', 1)[0] + 'renderHome();\n})();'
              js_path.write_text(js)

          html_path = Path('index.html')
          html = html_path.read_text()

          if 'moneta-180.png' not in html:
              links = (
                  '<link rel="icon" type="image/png" sizes="32x32" href="moneta-32.png">'
                  '<link rel="apple-touch-icon" sizes="180x180" href="moneta-180.png">'
                  '<link rel="manifest" href="manifest.webmanifest">'
              )
              html = html.replace('<title>', links + '<title>', 1)

          if 'src="moneta-192.png"' not in html:
              html = html.replace(
                  '<header>',
                  '<header><img src="moneta-192.png" alt="Moneta da un euro" width="80" height="80">',
                  1
              )

          html = html.replace('aggiornamenti.js?v=1.1', 'aggiornamenti.js?v=1.2')
          html_path.write_text(html)

          manifest = {
              'name': 'Gestione Contabile',
              'short_name': 'Contabile',
              'start_url': './',
              'scope': './',
              'display': 'standalone',
              'background_color': '#d8eef7',
              'theme_color': '#0b5f8f',
              'icons': [
                  {'src': f'moneta-{size}.png', 'sizes': f'{size}x{size}', 'type': 'image/png'}
                  for size in (192, 512)
              ]
          }
          Path('manifest.webmanifest').write_text(json.dumps(manifest))

          for size in (32, 180, 192, 512):
              with Image.open(f'moneta-{size}.png') as icon:
                  assert icon.size == (size, size)
                  icon.verify()
          PY

      - name: Verifica JavaScript
        run: node --check aggiornamenti.js

      - name: Salva file generati nel repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html aggiornamenti.js manifest.webmanifest moneta-*.png

          if ! git diff --cached --quiet; then
            git commit -m 'Aggiungi logo moneta e icone PNG statiche'
            git push origin HEAD:main
          fi

      - name: Prepara pubblicazione
        run: |
          mkdir -p _site
          cp index.html aggiornamenti.js manifest.webmanifest moneta-*.png _site/

      - id: deployment
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
